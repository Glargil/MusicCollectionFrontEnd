<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- https://www.bootstrapcdn.com/ US2 HYPE! -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
         <div v-if="!loggedIn">
            <input v-model="auth.username" placeholder="Username" type="text">
            <input v-model="auth.password" placeholder="Password" type="password">
            <button @click="login">Login</button>
            <p v-if="authMessage">{{ authMessage }}</p>
        </div>
        <div v-else>
            <p>
                Logged in as {{ auth.username }}, role: {{ role }}
                <button @click="logout">Logout</button>
            </p>
        <button @click="getAll" class="btn btn-primary">GetAll</button>
        <button @click="SearchRecord(title,artist)" class="btn btn-secondary">Search</button>
        <input v-model="title" placeholder="Title">
        <input v-model="artist" placeholder="Artist">
        <div v-if="records.length > 0">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Artist</th>
                        <th>Publication Year</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="record in records" :key="record.id">
                        <td>{{ record.id }}</td>
                        <td>{{ record.title }}</td>
                        <td>{{ record.artist }}</td>
                        <td>{{ record.publicationYear }}</td>
                        <td>{{ record.duration }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>
    <script src="index.js"></script>
</body>
</html>
